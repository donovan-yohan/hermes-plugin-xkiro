name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check out real Hermes Agent (test host)
        uses: actions/checkout@v4
        with:
          repository: donovan-yohan/hermes-agent
          # PR126899 contract, aligned with PR121149. Switch to an explicit
          # upstream revision only after the complete contract lands there.
          ref: c9230af278d050f89be1894aa14fabadf5b2c486
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Real provider discovery and credential-safe HTTP; no model_tools import
      # or mocked ProviderProfile. Keep this small dependency set explicit.
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml python-dotenv requests pydantic httpx
      - name: Run isolated checkout integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
        run: python -m pytest tests -ra
