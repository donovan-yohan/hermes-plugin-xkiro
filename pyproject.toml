[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-xkiro"
version = "0.1.0"
description = "xKiro model-provider plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Donovan Yohan" }]

[project.urls]
Homepage = "https://github.com/donovan-yohan/hermes-plugin-xkiro"
Repository = "https://github.com/donovan-yohan/hermes-plugin-xkiro"

[tool.setuptools]
py-modules = ["__init__"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
